name: Four repository handoff validation

on:
  push:
    branches: [audit/four-repo-handoffs-20260914]
    paths:
      - '.audit/next-four/**'
      - '.github/workflows/four-repo-handoffs.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'DivyamTalwar/edsl'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - slug: s2
            repository: s2-streamstore/s2
            sha: a271f7d9c4a185e4d0d4e73101f81980d7273737
          - slug: ParseBench
            repository: run-llama/ParseBench
            sha: e761ed81ff2e6d3ef3a81032d173a90c9f79c52d
          - slug: ledger
            repository: formancehq/ledger
            sha: 7d20326887509f06e4ae1c71eaf517cce20b2f7d
          - slug: chunkhound
            repository: chunkhound/chunkhound
            sha: 2df9c5a3b03330dd1a317a61c9b2eb8a054b206c
    steps:
      - name: Checkout audit inputs only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: audit_input
          persist-credentials: false
      - name: Checkout exact full upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: '${{ matrix.repository }}'
          ref: '${{ matrix.sha }}'
          path: repo
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Go toolchain
        if: matrix.slug == 'ledger'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.1'
          cache: false
      - name: Rust toolchain
        if: matrix.slug == 's2' || matrix.slug == 'chunkhound'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt
      - name: Nightly formatter
        if: matrix.slug == 's2'
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          components: rustfmt
      - name: Protobuf compiler
        if: matrix.slug == 's2'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: '${{ github.token }}'
      - name: Install uv
        if: matrix.slug == 'chunkhound'
        run: python -m pip install uv
      - name: Normalize transport whitespace and require exact authored inputs
        env:
          SLUG: '${{ matrix.slug }}'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          hashes = {
              's2': '0865c59960d3629d10c62b7b7be29a7b53981d4e9eb542edb1a480b757c93386',
              'ParseBench': '787031a4549b6b126152a8a8ede97a832e349dc9b0f9560e225412ef2254645c',
              'ledger': '024edb3a034adbf20395ceb3c1f650e9d00fc52c326c3382668124e5df352eb4',
              'chunkhound': '1ffb9cb5678c76763e8223faf31c453ffede2e2e5a6e12972a048503e962b9a0',
          }
          slug = os.environ['SLUG']
          path = Path('audit_input/.audit/next-four') / (slug + '.patch')
          original = path.read_bytes()
          content = original.replace(b'\n diff --git ', b'\ndiff --git ')
          actual = hashlib.sha256(content).hexdigest()
          if actual != hashes[slug]:
              raise SystemExit(f'Input mismatch for {slug}: {actual}; do not test an unreviewed transcription')
          path.write_bytes(content)
          print(slug, actual, 'transport_normalized=', original != content)
          PY
      - name: Before and after repository validation
        working-directory: repo
        env:
          SLUG: '${{ matrix.slug }}'
        run: python "$GITHUB_WORKSPACE/audit_input/.audit/next-four/runner.py" "$SLUG"
      - name: Preserve actual source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'handoff-${{ matrix.slug }}'
          path: 'evidence/${{ matrix.slug }}/'
          if-no-files-found: warn
          retention-days: 14
