name: S2 handoff stable toolchain validation
on:
  push:
    branches: [audit/four-repo-handoffs-20260914]
    paths: ['.github/workflows/s2-handoff-followup.yml']
permissions:
  contents: read
jobs:
  s2:
    if: github.repository == 'DivyamTalwar/edsl'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: audit_input
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: s2-streamstore/s2
          ref: a271f7d9c4a185e4d0d4e73101f81980d7273737
          path: repo
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: '${{ github.token }}'
      - name: Require exact authored input
        run: echo '0865c59960d3629d10c62b7b7be29a7b53981d4e9eb542edb1a480b757c93386  audit_input/.audit/next-four/s2.patch' | sha256sum -c -
      - name: Actual before and after SDK tests and clippy
        working-directory: repo
        run: python "$GITHUB_WORKSPACE/audit_input/.audit/next-four/runner.py" s2
      - name: Preserve exact patch and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handoff-s2
          path: evidence/s2/
          if-no-files-found: warn
          retention-days: 14
