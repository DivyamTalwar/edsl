name: Fork-only public source snapshots

on:
  push:
    branches: [audit/source-snapshots-20260914]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  snapshot:
    if: github.repository == 'DivyamTalwar/edsl'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {repo: s2-streamstore/s2, slug: s2}
          - {repo: run-llama/ParseBench, slug: ParseBench}
          - {repo: formancehq/ledger, slug: ledger}
          - {repo: chunkhound/chunkhound, slug: chunkhound}
          - {repo: zeronsh/zeron, slug: zeron}
          - {repo: kodustech/kodus-ai, slug: kodus-ai}
          - {repo: expectedparrot/edsl, slug: edsl}
          - {repo: laminlabs/lamindb, slug: lamindb}
          - {repo: generaltranslation/gt, slug: gt}
          - {repo: PrunaAI/pruna, slug: pruna}
          - {repo: tensorlakeai/tensorlake, slug: tensorlake}
          - {repo: vellum-ai/vellum-assistant, slug: vellum-assistant}
          - {repo: basetenlabs/truss, slug: truss}
          - {repo: datalayer/jupyter-mcp-server, slug: jupyter-mcp-server}
          - {repo: run-llama/llama-agents, slug: llama-agents}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repo }}
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Archive public tracked source without executing repository code
        env:
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git archive --format=zip --output="$RUNNER_TEMP/evidence/source.zip" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/evidence/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/baseline-commit.txt"
          printf '%s\n' "$TARGET_REPO" > "$RUNNER_TEMP/evidence/repository.txt"
          date -u +%FT%TZ > "$RUNNER_TEMP/evidence/retrieved-at.txt"
          sha256sum "$RUNNER_TEMP/evidence/source.zip" > "$RUNNER_TEMP/evidence/source-sha256.txt"
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ matrix.slug }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
